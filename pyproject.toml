[project]
name            = "m11-ocr-eagle1"
version         = "0.1.0"
description     = "Mission Eagle-1 : pilote automatique RL pour l'atterrisseur lunaire (LunarLander-v3), avec API FastAPI et GUI Streamlit."
authors         = [{name = "Rafael CEREZO MARTIN", email = "rafael.cerezo.martin@icloud.com"}]
readme          = "README.md"
requires-python = ">=3.10"

# #############################################################################
# DÉPENDANCES DE PRODUCTION (RL + API + GUI + VISUALISATION)
# #############################################################################
dependencies = [
    # --- Deep Learning ---
    "torch>=2.0.0",               # Backend PyTorch pour les réseaux DQN/PPO
    "torchvision>=0.15.0",        # Utilitaires vision (transforms, datasets)
    # --- ML & Clustering ---
    "scikit-learn>=1.3.0",        # Métriques et outils ML classiques
    # --- Reinforcement Learning ---
    "gymnasium[box2d]>=1.3.0",    # Environnements RL (LunarLander, CartPole, FrozenLake)
    "stable-baselines3[extra]>=2.9.0", # Implémentations PPO/DQN prêtes à l'emploi
    "pygame>=2.6.1",              # Rendu graphique des environnements Gymnasium
    "swig>=4.4.1",                # Requis pour compiler les bindings Box2D
    "tensorboard>=2.20.0",        # Visualisation des courbes d'entraînement
    # --- Data ---
    "numpy>=1.24.0",              # Calcul numérique (Q-tables, tenseurs)
    "pandas>=2.0.0",              # Manipulation de données tabulaires
    # --- Images ---
    "pillow>=10.0.0",             # Traitement d'images (frames d'épisodes)
    # --- Visualisation ---
    "matplotlib>=3.7.0",          # Graphiques statiques (courbes, heatmaps)
    "seaborn>=0.12.0",            # Visualisation statistique avancée
    # --- Notebooks ---
    "jupyter>=1.0.0",             # Environnement notebook complet
    "ipykernel>=6.25.0",          # Noyau Python pour JupyterLab
    # --- API (backend FastAPI) ---
    "fastapi>=0.115.0",           # Framework web pour exposer le modèle RL
    "uvicorn[standard]>=0.49.0",  # Serveur ASGI pour exécuter FastAPI
    # --- GUI & Dashboard (frontend Streamlit) ---
    "streamlit>=1.38.0",          # Interface graphique et tableau de bord
    "requests>=2.32.0",           # Appels HTTP de la GUI vers l'API
    "imageio-ffmpeg>=0.5.1",      # Encodage vidéo des épisodes joués (.mp4)
    # --- Utilitaires ---
    "pyyaml>=6.0",                # Lecture de fichiers de configuration
    "tqdm>=4.65.0",               # Barres de progression (entraînement)
    "umap-learn>=0.5.12",         # Réduction dimensionnelle (analyse d'observations)
    "torchinfo>=1.8.0",           # Résumé d'architecture des réseaux de neurones
    "torchviz>=0.0.3",            # Visualisation graphique des graphes PyTorch
    "rich>=15.0.0",               # Affichage console enrichi (logs, tableaux)
]

# #############################################################################
# GROUPES DE DÉPENDANCES OPTIONNELLES
# #############################################################################
[project.optional-dependencies]
extras = [
    # Réduction dimensionnelle UMAP (recommandé)
    "umap-learn>=0.5.3",
    # Visualisations interactives
    "plotly>=5.15.0",
    # Vision (optionnel — Pillow suffit pour ce projet)
    "opencv-python-headless>=4.8.0",
]
derma = [
    # Dataset DermaMNIST — hérité d'un projet précédent, sans lien avec Eagle-1
    "medmnist>=2.2.3",
]

# #############################################################################
# GROUPES DE DÉPENDANCES (TEST)
# #############################################################################
[dependency-groups]
test = [
    # Framework de test (validation des endpoints de l'API)
    "pytest>=7.4.3",              # Framework principal pour les tests unitaires
    "pytest-asyncio>=0.21.1",     # Support des tests d'endpoints asynchrones
    "httpx>=0.27.2",              # Client HTTP pour simuler des appels à l'API
]

[tool.uv]
dev-dependencies = []

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["."]